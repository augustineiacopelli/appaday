<!--
  ===================================================================
  APPADAY PORTAL - CUSTOM FEATURE MANIFEST  (read before any rebuild)
  Do NOT regenerate this file from a template or from memory. Always
  fetch the LIVE file, read the actual code below, preserve every
  feature here, and change it only with small targeted edits.
  Verify each of these still works after ANY change:
    1. Milestone markers - entries may carry `milestone:true`, rendered
       by .card-milestone-badge + the mBadge string in makeCard().
       Currently flagged: App 075 (Fiefdom), App 100 (Signal Desk), 
       App 125 (Blockwork), App 150 (Saga Studio).
       The "Milestone" filter button (data-filter="milestone") shows a
       flat, app-number-sorted grid of every milestone:true entry, with
       an empty-state fallback if none are flagged. Any app given
       milestone:true in the future is automatically picked up here,
       no other wiring needed.
    2. Starring - localStorage key "appaday-starred", .card-star toggle
       buttons on every live card, the "Starred" filter button, and the
       initDefault() logic that opens Starred on load when any exist,
       else All. The Starred view is GROUPED BY CATEGORY in CAT_ORDER
       with .section-header blocks, matching the All view, rather than
       listed flat in app-number order. Any category not in CAT_ORDER is
       appended after the known ones so a starred app can never vanish.
    3. coming_soon entries, AI badges (app.ai), per-category color
       overrides, and the og-image / twitter ?v=N cache-buster.
    4. New tab - localStorage key "appaday-newseen" holds the latest app
       date the visitor has acknowledged. The "New" filter button + its
       .new-count badge show apps whose date is newer than that marker;
       opening the New view advances the marker so the badge clears, and
       the set stays fixed for the rest of that session. A first-ever
       visit is baselined to the latest date (caught up, empty New).
    5. Search - #search-input in .filter-inner runs runSearch(), an
       ask-style ranked search with no AI. Every APPS entry MUST carry
       kw:"..." (15 to 30 lowercase ASCII words: the problem it solves,
       who it is for, synonyms, and the words someone would type when
       they need it). scoreApps() strips filler words (SEARCH_STOP),
       expands through SYN_GROUPS, and scores each app by field weight
       (name 6, kw 3, category or AI 2, desc 1) times word rarity (IDF),
       scaled by how many query ideas it covers, with stemming (stemToken),
       prefix and one-typo matching, a name-phrase bonus, number lookup,
       and "not/without X" exclusion. Results show a .card-why "Matched:"
       line. The type-ahead listbox (#search-suggest, buildSuggestions
       from app names, kw words, and category words) completes what is
       typed. It overrides the filter view WITHOUT changing currentFilter;
       clearing the box (#search-clear or emptying it) restores the
       active filter, and clicking any filter button clears the search.
    6. AI Powered + Chronological views - filter buttons data-filter="ai"
       and data-filter="chrono". "AI Powered" is a flat, app-number-sorted
       grid of every entry with ai:true (coming_soon excluded), with a
       count header. "Chronological" lists every app in one flat grid by
       app number, newest first by default; the .sort-toggle button in its
       header flips to oldest first (state in chronoNewestFirst, resets on
       reload). Neither view touches currentFilter rules for search.
  Update this manifest whenever a new portal feature is added.
  ==================================================================
-->

<style>
  :root {
    --ink: #0f0e0c;
    --paper: #f5f0e8;
    --paper-dark: #ede8df;
    --accent: #c8401a;
    --accent-dim: rgba(200, 64, 26, 0.12);
    --accent-mid: rgba(200, 64, 26, 0.35);
    --gold: #b8860b;
    --muted: #7a7468;
    --rule: rgba(15,14,12,0.12);
    --card-bg: rgba(255,253,248,0.9);
    --shadow: 0 2px 16px rgba(15,14,12,0.08), 0 1px 3px rgba(15,14,12,0.06);
    --shadow-hover: 0 8px 32px rgba(15,14,12,0.14), 0 2px 8px rgba(15,14,12,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--paper);
    color: var(--ink);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 64px 48px 48px;
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;
    max-width: 1280px;
    margin: 0 auto;
  }

  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .header-sub {
    font-size: 15px;
    color: var(--muted);
    margin-top: 20px;
    max-width: 440px;
    line-height: 1.6;
    font-weight: 300;
  }

  .header-stats {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: flex-end;
    padding-bottom: 4px;
  }

  .stat-block { text-align: right; }

  .stat-number {
    font-family: 'DM Serif Display', serif;
    font-size: 40px;
    line-height: 1;
    color: var(--ink);
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  .filter-zone {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 240, 232, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }

  .filter-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }

  .filter-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 5px 12px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    text-transform: uppercase;
  }

  .filter-btn:hover {
    border-color: var(--accent-mid);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .view-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .view-head .section-header { margin-bottom: 0; flex: 1 1 auto; }
  .sort-toggle {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-height: 36px;
    padding: 5px 12px;
    border-radius: 2px;
    border: 1px solid var(--accent-mid);
    background: var(--accent-dim);
    color: var(--accent);
    cursor: pointer;
  }
  .sort-toggle:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .search-wrap {
    display: flex;
    align-items: center;
    position: relative;
    margin-left: auto;
  }
  .search-input {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 6px 24px 6px 28px;
    width: 190px;
    max-width: 46vw;
    border-radius: 2px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    transition: all 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-input::placeholder {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent-mid);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .search-input::-webkit-search-decoration,
  .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    color: var(--muted);
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    display: none;
  }
  .search-clear:hover { color: var(--accent); }
  .search-clear.show { display: block; }
  .search-suggest {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    z-index: 40;
    overflow: hidden;
    display: none;
  }
  .search-suggest.show { display: block; }
  .card-why {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-top: 8px;
  }
  .suggest-row {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    padding: 9px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .suggest-row:last-child { border-bottom: none; }
  .suggest-row.active, .suggest-row:hover { background: var(--accent-dim); }
  .sg-head { color: var(--muted); }
  .sg-tail { color: var(--accent); font-weight: 500; }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 48px 96px;
    position: relative;
    z-index: 5;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 28px;
    margin-top: 56px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  .section-header:first-child { margin-top: 0; }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.01em;
  }

  .section-code {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .app-card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .app-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  .app-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(15,14,12,0.18);
  }

  .app-card:hover::after { transform: scaleX(1); }

  /* App icon row: home screen icon beside number and name */
  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-right: 52px;
    min-width: 0;
  }
  .card-head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .card-icon {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 13px;
    box-shadow: 0 1px 2px rgba(15,14,12,0.18), 0 4px 10px rgba(15,14,12,0.10);
    background: var(--rule);
    object-fit: cover;
    transition: transform 0.2s ease;
  }
  .app-card:hover .card-icon { transform: scale(1.04); }
  .card-icon-pending {
    display: block;
    background: transparent;
    box-shadow: none;
    border: 1.5px dashed var(--rule);
  }
  .card-icon-missing { visibility: hidden; }
  @media (max-width: 420px) {
    .card-icon { width: 48px; height: 48px; border-radius: 11px; }
    .card-head { gap: 12px; }
  }

  .card-number {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .card-name {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    font-weight: 300;
    flex: 1;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .card-cat {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    background: var(--accent-dim);
    color: var(--accent);
  }

  .card-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .card-arrow {
    position: absolute;
    top: 20px; right: 56px;
    font-size: 14px;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .app-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  .empty-state {
    grid-column: 1 / -1;
    padding: 64px 0;
    text-align: center;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
  }

  footer {
    position: relative;
    z-index: 5;
    border-top: 1px solid var(--rule);
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-motto {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
  }

  .footer-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }

  .footer-link:hover { color: var(--accent); }

  /* category color overrides */
  [data-cat="G"] .card-cat { background: rgba(39,110,183,0.1); color: #276EB7; }
  [data-cat="U"] .card-cat { background: rgba(40,150,100,0.1); color: #289664; }
  [data-cat="A"] .card-cat { background: rgba(140,50,180,0.1); color: #8C32B4; }
  [data-cat="D"] .card-cat { background: rgba(184,134,11,0.1); color: var(--gold); }
  [data-cat="P"] .card-cat { background: rgba(200,64,26,0.1); color: var(--accent); }

  [data-cat="G"] .app-card::after { background: #276EB7; }
  [data-cat="U"] .app-card::after { background: #289664; }
  [data-cat="A"] .app-card::after { background: #8C32B4; }
  [data-cat="D"] .app-card::after { background: var(--gold); }
  [data-cat="P"] .app-card::after { background: var(--accent); }

  /* coming-soon cards */
  .app-card.coming-soon {
    pointer-events: none;
    cursor: default;
    border: 1.5px dashed rgba(0,0,0,0.3);
    box-shadow: none;
    background: #c8c8c8 !important;
    color: #888 !important;
  }
  .app-card.coming-soon .card-number,
  .app-card.coming-soon .card-name,
  .app-card.coming-soon .card-desc,
  .app-card.coming-soon .card-date,
  .app-card.coming-soon .card-cat { color: #888 !important; background: rgba(0,0,0,0.06) !important; }
  .app-card.coming-soon .card-arrow { display: none; }
  .card-coming-badge {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.08);
    color: #666;
    border-radius: 4px;
    padding: 2px 7px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .card-ai-badge {
    display: inline-block;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(200,64,26,0.12);
    color: var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: 7px;
    vertical-align: middle;
    border: 1px solid rgba(200,64,26,0.25);
  }

  .card-milestone-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(184,134,11,0.12);
    color: var(--gold);
    border: 1px solid rgba(184,134,11,0.3);
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: 7px;
    vertical-align: middle;
  }
  .card-milestone-badge svg { vertical-align: -1px; margin-right: 3px; }
  .app-card.milestone { border-color: rgba(184,134,11,0.4); }
  .app-card.milestone::after { background: var(--gold); }

  .card-star {
    position: absolute;
    top: 14px; right: 14px;
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 5px;
    cursor: pointer;
    z-index: 4;
    transition: color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .card-star svg { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .card-star:hover { color: var(--gold); background: rgba(184,134,11,0.12); }
  .card-star:active { transform: scale(0.9); }
  .card-star.is-starred { color: var(--gold); }
  .card-star.is-starred svg { fill: currentColor; }
  .card-star:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .filter-star .star-count { margin-left: 4px; opacity: 0.75; }
  .filter-new .new-count {

function formatDate(iso) {
  const [y,m,d] = iso.split("-");
  return new Date(y, m-1, d).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}

function calcStreak() {
  // Streak = number of shipped apps with no gap in sequential numbering
  const nums = [...APPS]
    .filter(a => !a.coming_soon)
    .map(a => parseInt(a.num, 10))
    .sort((a,b) => b - a);
  let streak = 0;
  for (let i = 0; i < nums.length; i++) {
    if (i === 0) { streak = 1; continue; }
    if (nums[i-1] - nums[i] === 1) { streak++; } else break;
  }
  return streak;
}

const STAR_KEY = "appaday-starred";
let currentFilter = "all";
let chronoNewestFirst = true;
function loadStars() {
  try { const r = localStorage.getItem(STAR_KEY); return r ? new Set(JSON.parse(r)) : new Set(); }
  catch (e) { return new Set(); }
}
function saveStars() {
  try { localStorage.setItem(STAR_KEY, JSON.stringify([...starred])); } catch (e) {}
}
let starred = loadStars();
function updateStarCount() {
  const el = document.getElementById("star-count");
  if (!el) return;
  const n = APPS.filter(a => !a.coming_soon && starred.has(a.num)).length;
  el.textContent = n > 0 ? `(${n})` : "";
}
function toggleStar(num, name, btn) {
  if (starred.has(num)) starred.delete(num); else starred.add(num);
  saveStars();
  const on = starred.has(num);
  if (btn) {
    btn.classList.toggle("is-starred", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", (on ? "Unstar " : "Star ") + name);
  }
  updateStarCount();
  if (currentFilter === "starred") buildCards("starred");
}

const SEEN_KEY = "appaday-newseen";
function loadSeen() { try { return localStorage.getItem(SEEN_KEY) || ""; } catch (e) { return ""; } }
function saveSeen(v) { try { localStorage.setItem(SEEN_KEY, v); } catch (e) {} }
function latestDate() {
  let latest = "";
  APPS.forEach(a => { if (!a.coming_soon && a.date > latest) latest = a.date; });
  return latest;
}
function computeNew(seen) {
  if (!seen) return [];
  return APPS.filter(a => !a.coming_soon && a.date > seen).sort((x, y) => (x.num < y.num ? 1 : -1));
}
let sessionNew = [];
let newViewed = false;
function updateNewCount() {
  const el = document.getElementById("new-count");
  if (!el) return;
  const n = newViewed ? 0 : sessionNew.length;
  el.textContent = n > 0 ? String(n) : "";
}
function initNew() {
  const seen = loadSeen();
  if (!seen) { saveSeen(latestDate()); sessionNew = []; }
  else { sessionNew = computeNew(seen); }
  updateNewCount();
}

function makeCard(app, index) {
  const a = document.createElement("a");
  a.className = app.coming_soon ? "app-card coming-soon" : (app.milestone ? "app-card milestone" : "app-card");
  a.href = app.coming_soon ? "#" : app.url;
  if (!app.coming_soon) { a.target = "_blank"; a.rel = "noopener"; }
  a.setAttribute("data-cat", app.cat);
  a.style.animationDelay = `${index * 35}ms`;
  const badge = app.coming_soon ? `<span class="card-coming-badge">Coming ${formatDate(app.date)}</span>` : "";
  const aiBadge = app.ai ? `<span class="card-ai-badge">AI</span>` : "";
  const mBadge = app.milestone ? `<span class="card-milestone-badge"><svg viewBox="0 0 24 24" width="9" height="9" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.6 5.9 20.9l1.2-6.6L2.3 9l6.6-.9z" fill="currentColor"/></svg>Milestone</span>` : "";
  const isOn = starred.has(app.num);
  const starBtn = app.coming_soon ? "" : `<button type="button" class="card-star${isOn ? " is-starred" : ""}" aria-pressed="${isOn ? "true" : "false"}" aria-label="${isOn ? "Unstar " : "Star "}${app.name}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.6 5.9 20.9l1.2-6.6L2.3 9l6.6-.9z"/></svg></button>`;
  a.innerHTML = `
    <span class="card-arrow">↗</span>
    ${starBtn}
    <div class="card-head">
      ${app.coming_soon
        ? `<span class="card-icon card-icon-pending" aria-hidden="true"></span>`
        : `<img class="card-icon" src="icons/${app.num}.png" alt="" width="56" height="56" loading="lazy" decoding="async" onerror="this.classList.add('card-icon-missing')">`}
      <div class="card-head-text">
        <div class="card-number">${app.num}</div>
        <div class="card-name">${app.name}${badge}${aiBadge}${mBadge}</div>
      </div>
    </div>
    <div class="card-desc">${app.desc}</div>
    <div class="card-footer">
      <span class="card-cat">${CATS[app.cat].plural}</span>
      <span class="card-date">${formatDate(app.date)}</span>
    </div>
  `;
  if (!app.coming_soon) {
    const sb = a.querySelector(".card-star");
    if (sb) sb.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleStar(app.num, app.name, sb); });
  }
  return a;
}

function buildCards(filter) {
  currentFilter = filter;
  const main = document.getElementById("main-content");
  main.innerHTML = "";

  if (filter === "all") {
    CAT_ORDER.forEach(cat => {
      const group = APPS.filter(a => a.cat === cat);
      if (!group.length) return;
      const sec = document.createElement("div");
      sec.setAttribute("data-cat", cat);
      const hdr = document.createElement("div");
      hdr.className = "section-header";
      hdr.innerHTML = `
        <span class="section-title">${CATS[cat].label}</span>
        <span class="section-code">${cat}</span>
        <span class="section-count">${group.length} app${group.length !== 1 ? "s" : ""}</span>
      `;
      sec.appendChild(hdr);
      const grid = document.createElement("div");
      grid.className = "card-grid";
      group.forEach((app, i) => grid.appendChild(makeCard(app, i)));
      sec.appendChild(grid);
      main.appendChild(sec);
    });
  } else if (filter === "starred") {
    const list = APPS.filter(a => !a.coming_soon && starred.has(a.num));
    if (!list.length) {
      const grid = document.createElement("div");
      grid.className = "card-grid";
      const emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "No starred apps yet. Tap the star on any app to save it here.";
      grid.appendChild(emp);
      main.appendChild(grid);
    } else {
      // Starred is grouped by category, same section shape as the All view.
      const seenCats = [...CAT_ORDER, ...list.map(a => a.cat).filter(k => CAT_ORDER.indexOf(k) === -1)];
      seenCats.forEach(cat => {
        const group = list.filter(a => a.cat === cat);
        if (!group.length) return;
        const sec = document.createElement("div");
        sec.setAttribute("data-cat", cat);
        const hdr = document.createElement("div");
        hdr.className = "section-header";
        hdr.innerHTML = `
        <span class="section-title">${CATS[cat] ? CATS[cat].label : cat}</span>
        <span class="section-code">${cat}</span>
        <span class="section-count">${group.length} app${group.length !== 1 ? "s" : ""}</span>
      `;
        sec.appendChild(hdr);
        const grid = document.createElement("div");
        grid.className = "card-grid";
        group.forEach((app, i) => grid.appendChild(makeCard(app, i)));
        sec.appendChild(grid);
        main.appendChild(sec);
      });
    }
  } else if (filter === "milestone") {
    const grid = document.createElement("div");
    grid.className = "card-grid";
    const list = APPS.filter(a => a.milestone).sort((a, b) => a.num.localeCompare(b.num));
    if (!list.length) {
      const emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "No milestone apps flagged yet.";
      grid.appendChild(emp);
    } else {
      list.forEach((app, i) => grid.appendChild(makeCard(app, i)));
    }
    main.appendChild(grid);
  } else if (filter === "ai" || filter === "chrono") {
    const isAi = filter === "ai";
    const list = isAi
      ? APPS.filter(a => a.ai && !a.coming_soon).sort((a, b) => parseInt(a.num, 10) - parseInt(b.num, 10))
      : [...APPS].sort((a, b) => chronoNewestFirst
          ? (parseInt(b.num, 10) - parseInt(a.num, 10))
          : (parseInt(a.num, 10) - parseInt(b.num, 10)));
    const head = document.createElement("div");
    head.className = "view-head";
    const hdr = document.createElement("div");
    hdr.className = "section-header";
    const t = document.createElement("span"); t.className = "section-title"; t.textContent = isAi ? "AI Powered" : "Chronological";
    const code = document.createElement("span"); code.className = "section-code"; code.textContent = isAi ? "AI" : (chronoNewestFirst ? "New to Old" : "Old to New");
    const cnt = document.createElement("span"); cnt.className = "section-count";
    cnt.textContent = list.length + " app" + (list.length !== 1 ? "s" : "");
    hdr.appendChild(t); hdr.appendChild(code); hdr.appendChild(cnt);
    head.appendChild(hdr);
    if (!isAi) {
      const tog = document.createElement("button");
      tog.type = "button";
      tog.className = "sort-toggle";
      tog.textContent = chronoNewestFirst ? "Show oldest first" : "Show newest first";
      tog.addEventListener("click", () => { chronoNewestFirst = !chronoNewestFirst; buildCards("chrono"); });
      head.appendChild(tog);
    }
    main.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "card-grid";
    if (!list.length) {
      const emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "No apps to show yet.";
      grid.appendChild(emp);
    } else {
      list.forEach((app, i) => grid.appendChild(makeCard(app, i)));
    }
    main.appendChild(grid);
  } else if (filter === "new") {
    const grid = document.createElement("div");
    grid.className = "card-grid";
    if (!newViewed) { newViewed = true; saveSeen(latestDate()); }
    if (!sessionNew.length) {
      const emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "You're all caught up. Apps published since your last visit will appear here.";
      grid.appendChild(emp);
    } else {
      sessionNew.forEach((app, i) => grid.appendChild(makeCard(app, i)));
    }
    main.appendChild(grid);
  } else {
    const grid = document.createElement("div");
    grid.className = "card-grid";
    const visible = APPS.filter(a => a.cat === filter);
    if (!visible.length) {
      const emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "No apps in this category yet.";
      grid.appendChild(emp);
    } else {
      visible.forEach((app, i) => grid.appendChild(makeCard(app, i)));
    }
    main.appendChild(grid);
  }

  const liveApps = APPS.filter(a => !a.coming_soon);
  document.getElementById("total-count").textContent = liveApps.length;
  document.getElementById("streak-count").textContent = calcStreak();
  updateStarCount();
  updateNewCount();
}

function stemToken(w) {
  if (w.length < 5) return w;
  const suf = ["ings", "ies", "ing", "ers", "ied", "es", "ed", "er", "ly", "s"];
  for (let i = 0; i < suf.length; i++) {
    const s = suf[i];
    if (s === "s" && w.slice(-2) === "ss") continue;
    if (w.length > s.length && w.slice(-s.length) === s) {
      const st = w.slice(0, w.length - s.length);
      if (st.length >= 4) return st;
    }
  }
  return w;
}

function searchTokens(str) {

function editWithin1(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (la === lb && a[i] === b[j + 1] && a[i + 1] === b[j]) { i += 2; j += 2; continue; } // swapped letters
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return diff + (la - i) + (lb - j) <= 1;
}

      searchTokens(txt).forEach(t => {
        const s = stemToken(t);
        if (!terms[s] || terms[s].w < w) terms[s] = { w: w, word: t };
      });
    });
    Object.keys(terms).forEach(s => { df[s] = (df[s] || 0) + 1; });
    return { app: app, terms: terms, stems: Object.keys(terms), nameKey: searchTokens(app.name).join(" ") };
  });
  return { docs: docs, df: df, n: docs.length };
})();
function termIdf(stem) {
  const d = SEARCH_INDEX.df[stem] || 1;
  return Math.log(1 + SEARCH_INDEX.n / d);
}
// Best weighted hit of one word in one app: exact or stemmed, then prefix, then one-typo.
function bestHit(doc, word) {
  const s = stemToken(word);
  const t = doc.terms[s];
  if (t) return { w: t.w * termIdf(s), word: t.word };
  if (word.length < 3) return null;
  let best = null;
  const known = !!SEARCH_INDEX.df[s]; // real archive words are never typo-corrected
  for (let i = 0; i < doc.stems.length; i++) {
    const ds = doc.stems[i];
    let f = 0;
    if (word.length >= 3 && ds.length > word.length && ds.indexOf(word) === 0) f = 0.6;
    else if (!known && s.length >= 5 && ds.length >= 5 && editWithin1(s, ds)) f = 0.45;
    if (f) {
      const v = doc.terms[ds].w * termIdf(ds) * f;
      if (!best || v > best.w) best = { w: v, word: doc.terms[ds].word };
    }
  }
  return best;
}
function parseQuery(q) {
  const raw = searchTokens(q);
  const concepts = [], negs = [];
  let negNext = false;
  raw.forEach(t => {
    if (SEARCH_NEG.has(t)) { negNext = true; return; }
    if (SEARCH_STOP.has(t)) return;
    if (negNext) { negs.push(t); negNext = false; return; }
    concepts.push(t);
  });
  return { concepts: [...new Set(concepts)], negs: negs, phrase: raw.join(" ") };
}
function scoreApps(q) {
  const pq = parseQuery(q);
  if (!pq.concepts.length && !pq.negs.length) return [];
  const results = [];
  SEARCH_INDEX.docs.forEach(doc => {
    // Exclusions: a negated word that is central to the app (name, keywords, category) drops it.
    for (let i = 0; i < pq.negs.length; i++) {
      const h = bestHit(doc, pq.negs[i]);
      const syns = SYN[stemToken(pq.negs[i])];
      let central = h && doc.terms[stemToken(h.word)] && doc.terms[stemToken(h.word)].w >= 2;
      if (!central && syns) syns.forEach(x => { const t = doc.terms[stemToken(x)]; if (t && t.w >= 2) central = true; });
      if (central) return;
    }
    let total = 0, covered = 0;
    const why = [];
    pq.concepts.forEach(c => {
      let best = null;
      if (/^\d{1,3}$/.test(c) && Number(c) === Number(doc.app.num)) best = { w: 40, word: "#" + doc.app.num };
      const h = bestHit(doc, c);
      if (h && (!best || h.w > best.w)) best = h;
      // Synonyms count at half strength; with a direct hit they only add a small boost.
      let syn = null;
      const syns = SYN[stemToken(c)];
      if (syns) syns.forEach(x => { const sh = bestHit(doc, x); if (sh && (!syn || sh.w > syn.w)) syn = sh; });
      if (syn) {
        if (best) best = { w: best.w + syn.w * 0.15, word: best.word };
        else best = { w: syn.w * 0.5, word: syn.word };
      }
      if (best) { total += best.w; covered++; if (why.indexOf(best.word) === -1) why.push(best.word); }
    });
    if (!pq.concepts.length) { results.push({ app: doc.app, score: 0.001, why: [] }); return; }
    if (!covered) return;
    const coverage = covered / pq.concepts.length;
    let score = total * (0.35 + 0.65 * coverage * coverage);
    if (doc.nameKey && pq.phrase.indexOf(doc.nameKey) !== -1) score += 25;
    results.push({ app: doc.app, score: score, why: why });
  });
  results.sort((a, b) => b.score - a.score || Number(b.app.num) - Number(a.app.num));
  if (!results.length) return results;
  const top = results[0].score;
  if (pq.concepts.length < 2) return results.slice(0, 40);
  return results.filter((r, i) => i < 3 || r.score >= top * 0.25).slice(0, 30);
}
function refreshStats() {
  document.getElementById("total-count").textContent = APPS.filter(a => !a.coming_soon).length;
  document.getElementById("streak-count").textContent = calcStreak();
  updateStarCount();
  updateNewCount();
}
function runSearch(q) {
  const main = document.getElementById("main-content");
  main.innerHTML = "";
  const results = scoreApps(q);

  const hdr = document.createElement("div");
  hdr.className = "section-header";
  const t = document.createElement("span"); t.className = "section-title"; t.textContent = "Best matches";
  const code = document.createElement("span"); code.className = "section-code"; code.textContent = q;
  const cnt = document.createElement("span"); cnt.className = "section-count";
  cnt.textContent = results.length + " result" + (results.length !== 1 ? "s" : "");
  hdr.appendChild(t); hdr.appendChild(code); hdr.appendChild(cnt);
  main.appendChild(hdr);

  const grid = document.createElement("div");
  grid.className = "card-grid";
  if (!results.length) {
    const emp = document.createElement("div");
    emp.className = "empty-state";
    emp.textContent = "Nothing matched. Try other words, like prayer, kids game, budget, or a question such as what helps me sleep.";
    grid.appendChild(emp);
  } else {
    results.forEach((r, i) => {
      const card = makeCard(r.app, i);
      if (r.why.length) {
        const w = document.createElement("div");
        w.className = "card-why";
        w.textContent = "Matched: " + r.why.slice(0, 4).join(", ");
        const foot = card.querySelector(".card-footer");
        if (foot) card.insertBefore(w, foot); else card.appendChild(w);
      }
      grid.appendChild(card);
    });
  }
  main.appendChild(grid);
  refreshStats();
}
function clearActiveButtons() {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
}
function restoreActiveButton() {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === currentFilter));
}
function onSearchInput() {
  searchQuery = searchInput.value.trim();
  searchClear.classList.toggle("show", searchQuery.length > 0);
  updateSuggest(searchInput.value);
  if (searchQuery) { clearActiveButtons(); runSearch(searchQuery); }
  else { restoreActiveButton(); buildCards(currentFilter); }
}
function clearSearchInput() {
  searchInput.value = "";
  searchQuery = "";
  searchClear.classList.remove("show");
  hideSuggest();
}
// --- type-ahead suggestions (vocabulary from app names + categories) ---
const SUGGEST = (function () {
  const words = new Set();
  const names = [];
  const addWords = (str) => str.toLowerCase().split(/[^a-z0-9]+/).forEach(w => { if (w.length >= 3) words.add(w); });
  APPS.forEach(a => { names.push(a.name); addWords(a.name); if (a.kw) addWords(a.kw); });
  Object.keys(CATS).forEach(k => { addWords(CATS[k].label); addWords(CATS[k].plural); });
  return { words: [...words].sort(), names: names };
})();
let activeIndex = -1;

function buildSuggestions(raw) {
  const full = raw.trim().toLowerCase();
  if (full.length < 2) return [];
  const out = [];
  const seen = new Set();
  const add = (disp) => {
    const key = disp.toLowerCase();
    if (key === full || seen.has(key)) return;
    seen.add(key); out.push(disp);
  };
  SUGGEST.names.filter(nm => nm.toLowerCase().startsWith(full))
    .sort((a, b) => a.length - b.length).forEach(add);
  const parts = full.split(/\s+/);
  const last = parts[parts.length - 1];
  const head = parts.slice(0, -1).join(" ");
  if (last.length >= 2) {
    SUGGEST.words.filter(v => v.startsWith(last) && v !== last)
      .sort((a, b) => a.length - b.length)
      .forEach(v => add((head ? head + " " : "") + v));
  }
  return out.slice(0, 6);
}
function renderSuggestions(list, raw) {
  const box = document.getElementById("search-suggest");
  box.innerHTML = "";
  if (!list.length) { box.classList.remove("show"); activeIndex = -1; return; }
  const typedLen = raw.trim().length;
  list.forEach((disp, i) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "suggest-row" + (i === 0 ? " active" : "");
    row.setAttribute("role", "option");
    row.dataset.value = disp;
    const h = document.createElement("span"); h.className = "sg-head"; h.textContent = disp.slice(0, typedLen);
    const t = document.createElement("span"); t.className = "sg-tail"; t.textContent = disp.slice(typedLen);
    row.appendChild(h); row.appendChild(t);
    row.addEventListener("pointerdown", (e) => { e.preventDefault(); acceptSuggestion(disp); });
    box.appendChild(row);
  });
  box.classList.add("show");
  activeIndex = 0;
}
function updateSuggest(raw) { renderSuggestions(buildSuggestions(raw), raw); }
function hideSuggest() {
  const box = document.getElementById("search-suggest");
  if (!box) return;
  box.classList.remove("show"); box.innerHTML = ""; activeIndex = -1;
}
function setActiveRow(rows) {
  rows.forEach((r, i) => r.classList.toggle("active", i === activeIndex));
  const el = rows[activeIndex];
  if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
}
function acceptSuggestion(disp) {
  searchInput.value = disp;
  searchQuery = disp.trim();
  searchClear.classList.add("show");
  hideSuggest();
  clearActiveButtons();
  runSearch(searchQuery);
  searchInput.focus();
}

if (searchInput) {
  searchInput.addEventListener("input", onSearchInput);
  searchInput.addEventListener("keydown", (e) => {
    const box = document.getElementById("search-suggest");
    const rows = [].slice.call(box.querySelectorAll(".suggest-row"));
    if (!box.classList.contains("show") || !rows.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = (activeIndex + 1) % rows.length; setActiveRow(rows); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = (activeIndex - 1 + rows.length) % rows.length; setActiveRow(rows); }
    else if (e.key === "Enter" || e.key === "Tab") { if (activeIndex >= 0) { e.preventDefault(); acceptSuggestion(rows[activeIndex].dataset.value); } }
    else if (e.key === "Escape") { hideSuggest(); }
  });
  searchInput.addEventListener("blur", () => { setTimeout(hideSuggest, 120); });
  searchClear.addEventListener("click", () => {
    clearSearchInput();
    restoreActiveButton();
    buildCards(currentFilter);
    searchInput.focus();
  });
}

// ============================================================
//  FILTER BUTTONS
// ============================================================
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    clearSearchInput();
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    buildCards(btn.dataset.filter);
  });
});

// Initialize the "New since last visit" badge before the first render.
initNew();

// On load, open the Starred view if the visitor has starred anything; otherwise All.
(function initDefault(){
  const hasStarred = APPS.some(a => !a.coming_soon && starred.has(a.num));
  const initial = hasStarred ? "starred" : "all";
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === initial));
  buildCards(initial);
})();
</script>
